<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090D0A">
  <title>404 // Signal Lost — Toxssicity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#090D0A; --panel:#111914; --green:#A3FF12; --green-hover:#C5FF69; --text:#E5F0E6; --muted:#849487; --border:#29382C; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text);
      font-family:Inter,sans-serif; background-color:var(--bg);
      background-image:linear-gradient(rgba(163,255,18,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(163,255,18,.018) 1px,transparent 1px);
      background-size:24px 24px;
    }
    main { width:min(100%,560px); padding:48px 38px; text-align:center; background:rgba(17,25,20,.94); border:1px solid var(--border); border-radius:12px; box-shadow:0 24px 80px rgba(0,0,0,.55); position:relative; }
    main::before { content:""; position:absolute; top:-1px; left:25%; width:50%; height:1px; background:linear-gradient(90deg,transparent,var(--green),transparent); }
    .mark { width:62px; height:62px; display:grid; place-items:center; margin:0 auto 22px; border:1px solid rgba(163,255,18,.45); border-radius:16px; background:rgba(163,255,18,.06); color:var(--green); font:800 25px 'JetBrains Mono',monospace; }
    .code { color:var(--green); font:800 clamp(64px,15vw,104px)/1 'JetBrains Mono',monospace; letter-spacing:-8px; text-shadow:0 0 34px rgba(163,255,18,.16); }
    h1 { margin-top:18px; font:700 18px 'JetBrains Mono',monospace; letter-spacing:1.5px; text-transform:uppercase; }
    p { margin:12px auto 28px; max-width:390px; color:var(--muted); font-size:14px; line-height:1.7; }
    a { display:inline-block; padding:13px 20px; color:#101609; background:var(--green); border-radius:6px; text-decoration:none; font:800 11px 'JetBrains Mono',monospace; letter-spacing:1.3px; text-transform:uppercase; transition:.2s ease; }
    a:hover { background:var(--green-hover); box-shadow:0 0 24px rgba(163,255,18,.16); transform:translateY(-1px); }
    footer { margin-top:30px; color:#59675B; font:10px 'JetBrains Mono',monospace; letter-spacing:1.2px; }
    @media(max-width:480px) { main { padding:38px 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark">T.</div>
    <div class="code">404</div>
    <h1>Signal Lost</h1>
    <p>The page you're looking for isn't available. It may have moved, been renamed, or never existed.</p>
    <a href="/">Return to access</a>
    <footer>TOXSSICITY // SEE BEYOND THE INJECTION</footer>
  </main>
</body>
</html>
